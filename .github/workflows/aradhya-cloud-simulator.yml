name: Aradhya 24/7 Autonomous Cloud Simulator

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Command / Task for Aradhya (e.g. "Check stock", "status", "audit")'
        required: true
        default: 'status'
        type: string
      details:
        description: 'Additional task details'
        required: false
        default: ''
        type: string
  schedule:
    # 24/7 Autonomous Maintenance Cycle every 2 hours
    - cron: '0 */2 * * *'
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  run-cloud-simulator:
    name: Aradhya 24/7 Cloud Simulation (Alpesh Sir Only)
    runs-on: ubuntu-latest

    steps:
      - name: Verify Security & Authorization
        run: |
          ACTOR="${{ github.actor }}"
          echo "Initiating caller check for actor: $ACTOR"
          if [ "$ACTOR" != "thakoralpesh3" ] && [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "::error::⛔ Access Denied! Only Alpesh Sir (thakoralpesh3) can execute cloud commands."
            exit 1
          fi
          echo "✅ Authentication confirmed for Alpesh Sir ($ACTOR)."

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt || true
          fi

      - name: Execute Autonomous Command (Workflow Dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          python3 aradhya_cloud_simulator.py \
            --actor "${{ github.actor }}" \
            --command "${{ inputs.command }}" \
            --details "${{ inputs.details }}"

      - name: Execute 24/7 Autonomous Scheduled Cycle
        if: github.event_name == 'schedule'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_ACTOR: "thakoralpesh3"
        run: |
          python3 aradhya_cloud_simulator.py \
            --actor "thakoralpesh3" \
            --scheduled-cycle

      - name: Execute Issue Command (If Opened by Alpesh Sir)
        if: github.event_name == 'issues' || github.event_name == 'issue_comment'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_ACTOR: ${{ github.actor }}
          ISSUE_BODY: ${{ github.event.comment.body || github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ "${{ github.actor }}" == "thakoralpesh3" ]; then
            python3 aradhya_cloud_simulator.py \
              --actor "${{ github.actor }}" \
              --command "$ISSUE_BODY" \
              --details "Triggered from GitHub Issue #$ISSUE_NUMBER"
          else
            echo "Skipping non-authorized issue actor."
          fi

      - name: Commit & Push Cloud State Reconciliations
        run: |
          git config user.name "Aradhya Cloud Bot"
          git config user.email "aradhya-cloud@chamunda-re.enterprise"
          git add data/cloud_shadow_state.json data/cloud_task_queue.json data/notifications_history.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(cloud-simulator): 24/7 cloud state snapshot auto-sync [skip ci]"
            git push origin main
            echo "🚀 Pushed updated cloud state back to main branch!"
          else
            echo "Cloud state clean; no updates to commit."
          fi
