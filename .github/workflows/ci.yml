name: Chamunda RE Enterprise • CI & Integrity Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Syntax & Autonomous Integrity Preflight
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install System Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y curl procps

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Code Syntax
        run: |
          python3 -m py_compile *.py

      - name: Health Check & Cloud Mirror Smoke Test
        env:
          PORT: 8081
          PYTHONUNBUFFERED: "1"
        run: |
          python3 cloud_mirror_server.py &
          SERVER_PID=$!
          sleep 6
          curl -fsSL http://127.0.0.1:8081/api/health
          kill -9 $SERVER_PID || true
